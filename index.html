        .font-arcade { font-family: 'Press Start 2P', cursive; }
        .font-crt { font-family: 'VT323', monospace; }
        .font-spidy { font-family: 'Bangers', cursive; }

        /* CRT Overlay for Classic Arcade Monitor */
        .crt-overlay {
            background: linear-gradient(
                rgba(18, 4, 4, 0) 50%, 
                rgba(0, 0, 0, 0.45) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.04),
                rgba(100, 0, 0, 0.02),
                rgba(180, 0, 0, 0.04)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none !important; /* CRITICAL: Prevent overlay from blocking clicks */
        }

        .crt-overlay.disabled {
            display: none;
        }

        @keyframes crt-flicker {
            0% { opacity: 0.98; }
            50% { opacity: 1; }
            100% { opacity: 0.97; }
        }

        .crt-container {
            animation: crt-flicker 0.15s infinite;
        }

        /* Spider Web Background Pattern */
        .spider-web-bg {
            background-color: #0b0101;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(185, 28, 28, 0.2) 0%, transparent 70%),
                repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 20px, rgba(220, 38, 38, 0.05) 21px, rgba(220, 38, 38, 0.05) 22px),
                linear-gradient(0deg, rgba(220, 38, 38, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(220, 38, 38, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }

        /* Pure Red Glow Effects - Strictly No Neon / Cyan */
        .spidy-red-glow-text {
            text-shadow: 0 0 8px #ff2222, 0 0 18px #a80000, 0 0 28px #550000;
        }
        
        .spidy-card-glow {
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.35), inset 0 0 12px rgba(153, 27, 27, 0.25);
        }

        .spidy-card-glow:hover {
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.8), inset 0 0 18px rgba(185, 28, 28, 0.5);
            transform: translateY(-4px);
        }

        @keyframes pulse-marquee {
            0%, 100% { filter: drop-shadow(0 0 14px #ff0000); opacity: 1; }
            50% { filter: drop-shadow(0 0 4px #770000); opacity: 0.85; }
        }

        .spidy-marquee {
            animation: pulse-marquee 1.6s infinite ease-in-out;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #180202; }
        ::-webkit-scrollbar-thumb {
            background: #991b1b;
            border: 2px solid #450a0a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: #dc2626; }

        // Web Audio API Retro Sound Effects Synthesizer
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playHover() {
                if (this.muted) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.05);
                } catch(e) {}
            }

            playCoin() {
                if (this.muted) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(987.77, this.ctx.currentTime);
                    osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.09, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.28);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.28);
                } catch(e) {}
            }

            playLaunch() {
                if (this.muted) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                } catch(e) {}
            }
        }

                    <div class="absolute top-0 right-0 w-12 h-12 pointer-events-none opacity-20 group-hover:opacity-60 transition-opacity">
                        <svg viewBox="0 0 100 100" class="text-red-500 fill-current">
                            <path d="M0,0 L100,0 L100,100 Z M20,0 L100,80 M40,0 L100,60 M60,0 L100,40 M80,0 L100,20" stroke="currentColor" stroke-width="3" fill="none"/>
                        </svg>
                    </div>

                    <!-- Top Badge Row -->
                    <div class="flex justify-between items-center mb-3 pointer-events-none">
                        <span class="text-[9px] font-arcade bg-red-950 text-red-400 border border-red-800/80 px-2 py-1 rounded shadow">
                            ${game.category}
                        </span>
                        <span class="text-[9px] font-arcade text-red-300 bg-red-900/40 px-2 py-0.5 rounded border border-red-800">
                            ${game.badge}
                        </span>
                    </div>

                    <!-- Icon Graphic -->
                    <div class="my-3 flex justify-center items-center pointer-events-none">
                        <div class="w-16 h-16 rounded-xl bg-[#330404] border-2 border-red-700/80 flex items-center justify-center text-red-400 group-hover:text-red-100 group-hover:border-red-500 group-hover:scale-110 transition-all duration-300 shadow-[inset_0_0_15px_rgba(220,38,38,0.4)]">
                            <svg class="w-10 h-10" viewBox="0 0 24 24">
                                ${game.svg}
                            </svg>
                        </div>
                    </div>

                    <!-- Game Info -->
                    <div class="text-center mt-2 mb-4 flex-grow pointer-events-none">
                        <h3 class="text-base font-arcade text-red-300 group-hover:text-white transition-colors tracking-wide spidy-red-glow-text mb-2">
                            ${game.title}
                        </h3>
                        <p class="text-xs text-red-400/80 font-crt line-clamp-2 leading-relaxed">
                            ${game.desc}
                        </p>
                    </div>

                    <!-- Direct Clickable Play Button Anchor Area -->
                    <div class="pt-2 pointer-events-none">
                        <div class="play-btn w-full bg-red-900/60 group-hover:bg-red-700 text-red-200 group-hover:text-white border border-red-600 font-arcade text-xs py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition-all duration-300 shadow-md">
                            <span>PLAY GAME</span>
                            <svg class="w-3.5 h-3.5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                            </svg>
                        </div>
                    </div>
                `;

                // Sound triggers on hover and click
                card.addEventListener('mouseenter', () => sfx.playHover());
                card.addEventListener('click', () => sfx.playLaunch());

                gamesGrid.appendChild(card);
            });
        }

        // Initial Render
        renderGames(gamesList);

        // Realtime Search Filter
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = gamesList.filter(game => 
                game.title.toLowerCase().includes(query) || 
                game.category.toLowerCase().includes(query) ||
                game.desc.toLowerCase().includes(query)
            );
            renderGames(filtered);
        });

        // Insert Coin Counter
        const insertCoinBtn = document.getElementById('insertCoinBtn');
        const coinCountDisplay = document.getElementById('coinCount');
        let currentCoins = 99;

        insertCoinBtn.addEventListener('click', () => {
            sfx.playCoin();
            currentCoins++;
            coinCountDisplay.textContent = currentCoins;
            coinCountDisplay.classList.add('text-white');
            setTimeout(() => coinCountDisplay.classList.remove('text-white'), 200);
        });

        // Sound Mute Toggle
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');

        soundToggleBtn.addEventListener('click', () => {
            sfx.muted = !sfx.muted;
            if (sfx.muted) {
                soundIcon.classList.add('opacity-40');
                soundToggleBtn.classList.add('bg-red-900');
            } else {
                soundIcon.classList.remove('opacity-40');
                soundToggleBtn.classList.remove('bg-red-900');
                sfx.playCoin();
            }
        });

        // CRT Scanlines Toggle Switch
        const crtToggleBtn = document.getElementById('crtToggleBtn');
        const crtOverlay = document.getElementById('crtOverlay');
        let crtEnabled = true;

        crtToggleBtn.addEventListener('click', () => {
            sfx.playCoin();
            crtEnabled = !crtEnabled;
            if (crtEnabled) {
                crtOverlay.classList.remove('disabled');
                crtToggleBtn.textContent = 'CRT: ON';
                crtToggleBtn.classList.remove('bg-red-900');
            } else {
                crtOverlay.classList.add('disabled');
                crtToggleBtn.textContent = 'CRT: OFF';
                crtToggleBtn.classList.add('bg-red-900');
            }
        });
    </script>
</body>
</html>
